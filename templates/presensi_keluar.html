<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Karyawan</title>
    <style>
        body {
            margin: 0;
            background: white;
            height: 97vh;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: tomato;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .navbar-title {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .form-container {
            max-width: 500px;
            margin: auto auto;
            padding: 50px;
            background-color: tomato;
            backdrop-filter: blur(30px);
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 62, 104, 0.548);
            position: relative;
            top: 10%;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            margin-left: 5px;
        }

        input[type="number"] {
            width: calc(100% - 50px);
            padding: 10px;
            border: 3px solid rgb(160, 0, 0);
            border-radius: 10px;
        }

        select {
            width: calc(100% - 25px);
            padding: 10px;
            border: 3px solid rgb(33, 185, 255);
            border-radius: 10px;
            background-color: white;
            color: black;
            font-size: 16px;
            padding-left: 15px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 17px;
            background-color:#48c24e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        button:hover {
            background-color: #40b045;
        }

        .link-kembali {
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            color: #262626;
            background-color: tomato;
            border-radius: 4px;
            padding: 10px 14px;
            font-size: 16px;
        }
        .link-kembali:hover{
            background-color: rgb(228, 87, 63);
        }

    </style>
</head>

<body>
    <div class="navbar">
        <div class="navbar-title">ToMart 🍅</div>
    </div>

    <div class="form-container">
        <h1>Presensi Selesai Kerja</h1>
        <form action="" method="POST">
            <div class="form-group">
                <label for="id_pegawai">Masukkan ID</label>
                <input type="number" id="id_pegawai" name="id_pegawai" placeholder="ID Pegawai" required>
            </div>
            <button type="submit">Selesai</button>
        </form>
        <a href="/back" class="link-kembali">Kembali</a>
    </div>
</body>

</html>
