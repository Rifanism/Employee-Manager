<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Karyawan</title>
    <style>
        body {
            margin: 0;
            background: #f0f4ff;
            font-family: Arial, sans-serif;
            height: 70vh;
        }

        .navbar {
            background-color: tomato;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .navbar-title {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .form-container {
            max-width: 500px;
            margin: auto auto;
            padding: 50px;
            background-color: tomato;
            background-image: linear-gradient(to top, rgba(255, 0, 0, 0.582), rgba(255, 56, 1, 0.226));
            backdrop-filter: blur(30px);
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(104, 0, 0, 0.548);
            position: relative;
            top: 10%;
        }

        h1{
            color: white;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            color: white;
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            margin-left: 5px;
        }

        input[type="text"],
        input[type="number"] {
            width: calc(100% - 50px);
            padding: 10px;
            border: 2px solid rgb(147, 7, 7);
            border-radius: 10px;
        }

        select {
            width: calc(100% - 25px);
            padding: 10px;
            border: 2px solid rgb(147, 7, 7);
            border-radius: 10px;
            background-color: white;
            color: black;
            font-size: 14px;
            padding-left: 15px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 15px;
            background-color:#48c24e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        button:hover {
            background-color: #40b045;
        }

        .link-kembali {
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            color: white;
            padding: 10px 15px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .link-kembali:hover{
            background-color: rgba(255, 255, 255, 0.1);
        }

    </style>
</head>

<body>

    <div class="navbar">
        <div class="navbar-title">ToMart 🍅</div>
    </div>

    <div class="form-container">
        <h1>Tambah Pegawai Baru</h1>
        <form action="" method="POST">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
            </div>
            <div class="form-group">
                <Label for="Posisi">Posisi</Label>
                <input type="text" id="Posisi" name="Posisi" placeholder="Masukkan posisi pegawai" required>
            </div>
            <div class="form-group">
                <label for="Divisi">Divisi</label>
                <select id="Divisi" name="Divisi">
                    <option value="Manajemen Puncak">Manajemen Puncak</option>
                    <option value="Keamanan">Keamanan</option>
                    <option value="Kebersihan">Kebersihan</option>
                    <option value="Penataan Barang">Penataan Barang</option>
                    <option value="Gudang & Logistik">Gudang & Logistik</option>
                    <option value="Kasir">Kasir</option>
                </select>
            </div>
            <div class="form-group">
                <label for="gaji">Gaji</label>
                <input type="number" id="gaji" name="gaji" placeholder="Contoh: 3000000" required>
            </div>
            <button type="submit">Simpan</button>
        </form>
        <a href="/pegawai" class="link-kembali">Kembali</a>
    </div>
</body>

</html>
