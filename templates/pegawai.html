<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimarket - Pegawai</title>
    
    <style>
        body {
            margin: 0;
            background: #f0f4ff;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: tomato;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .navbar-title {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            background-color: rgb(255, 255, 255);
            height: 100vh;
        }

        .JUDUL { 
            text-align: center; 
            color: #111111;
            font-family: Arial, Helvetica, sans-serif;
            font-size: large;
            border-radius: 100px;
            padding: 10px 0px;
        }

        .NamaBelakang {
            color: pink;
            text-align: center;
            background-color: #007bff;
        }


        table { 
            width: max-content;
            border-collapse: collapse;
            margin: 20px auto;
            margin-bottom: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            background-color: #fff; 
            table-layout: auto;
            margin: 0;
        }

        th, td { 
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        .row-name{
            text-align: left;
        }


        th { 
            background-color: #4f9bff;
            color: white;
        }

        tr:nth-child(even) { 
            background-color: #f2f2f2;
        }


        .action-btn { 
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            color: #ffffff;
            font-size: 14px;
            margin-right: 5px;
        }

        .tambah {
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 5px;
            color: #000000;
            font-size: 14px;
            background-color: #48c24e;
            color: white; 
            padding: 13px 20px;
            font-size: 16px;
            transition: 0.2s;
        }

        .tambah:hover{
            background-color: #44b74a;
        }

        .kembali {
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 5px;
            color: #000000;
            font-size: 14px;
            background-color: #da3c46;
            color: white; 
            padding: 13px 20px;
            font-size: 16px;
            transition: 0.2s;
        }

        .kembali:hover{
            background-color: #ca353f;
        }

        .kembali-button{
            text-align: left;
            margin-left: 60px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }
        .kembali-button a{
            display: block; 
            padding: 10px 15px;
            text-decoration: none;
            margin-left: 299px;
        }

        .btn-tambah { 
            background-color: #48c24e;
            color: white; 
            padding: 10px 10px;
            font-size: 16px;
        }

        .btn-detail { 
            background-color: #ffc107;
            color: black;
            transition: 0.2s;
        }

        .btn-detail:hover{
            background-color: #edb408;
        }

        .btn-hapus { 
            background-color: #dc3545;
            color: white; 
        }
        .table-container{
            max-height: 400px;
            overflow-y: auto;
            margin: 0 auto;
            width: max-content;
            border: 1px solid #ddd;
            border-top: none;
        }

        .table-container thead th {
            position: sticky;
            top: 0;
            background-color: tomato;
            color: white;
            z-index: 2;
        }
    </style>

    
</head>
<body>

    <div class="navbar">
        <div class="navbar-title">ToMart 🍅</div>
    </div>

    <section class="container">
    <h1 class="JUDUL">Pegawai Minimarket</h1>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID Pegawai</th>
                    <th>Nama</th>
                    <th>Divisi</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody>
            {% for row in pegawai %}
                <tr>
                    <td>{{row.id}}</td>
                    <td class="row-name">{{row.nama}}</td>
                    <td>{{row.nama_divisi}}</td>
                    <td>
                        <a href="{{ url_for('detail', id=row.id) }}" class="action-btn btn-detail">Detail 🔍</a>
                        <a href="/delete/{{row.id}}" class="action-btn btn-hapus" onclick="return confirm('Yakin ingin menghapus?')">Hapus 🗑️</a>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
    <br><br>
    <div class="kembali-button">
        <a href="/pegawai/tambah-pegawai" class="tambah">Tambah Pegawai Baru</a>
        <a href="/back" class="kembali">Kembali</a>
    </div>
    </section>
</body>
</html>
