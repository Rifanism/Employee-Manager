<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimarket - Pegawai</title>
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0px 300px; 
            background-color: #ffffff; 
        }

        .container {
            background-color: rgb(255, 255, 255);
            height: 100vh;
        }

        .JUDUL { 
            text-align: center; 
            color: #111111;
            font-family: Arial, Helvetica, sans-serif;
            font-size: large;
            
            border-radius: 100px;
            padding: 10px 0px;
        }

        .NamaBelakang {
            color: pink;
            text-align: center;
            background-color: #007bff;
        }


        table { 
            width: max-content;
            border-collapse: collapse;
            margin: 20px auto;
            margin-bottom: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            background-color: #fff; 
            table-layout: auto;
        }

        th, td { 
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        .row-name{
            text-align: left;
        }


        th { 
            background-color: #4f9bff;
            color: white;
        }

        tr:nth-child(even) { 
            background-color: #f2f2f2;
        }


        .action-btn { 
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            color: #ffffff;
            font-size: 14px;
            margin-right: 5px;
        }

        .tambah {
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 5px;
            color: #000000;
            font-size: 14px;
            background-color: #48c24e;
            color: white; 
            padding: 13px 20px;
            font-size: 16px;
            transition: 0.2s;
        }

        .tambah:hover{
            background-color: #44b74a;
        }

        .kembali {
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 5px;
            color: #000000;
            font-size: 14px;
            background-color: #da3c46;
            color: white; 
            padding: 13px 20px;
            font-size: 16px;
            transition: 0.2s;
        }

        .kembali:hover{
            background-color: #ca353f;
        }

        .kembali-button{
            text-align: left;
            margin-left: 60px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }
        .kembali-button a{
            display: block; 
            padding: 10px 15px;
            text-decoration: none;
        }

        .btn-tambah { 
            background-color: #48c24e;
            color: white; 
            padding: 10px 10px;
            font-size: 16px;
        }

        .btn-detail { 
            background-color: #ffc107;
            color: black;
            transition: 0.2s;
        }

        .btn-detail:hover{
            background-color: #edb408;
        }

        .btn-hapus { 
            background-color: #dc3545;
            color: white; 
        }
    </style>

    
</head>
<body>
    <section class="container">
    <h1 class="JUDUL">Pegawai Minimarket</h1>

    <table>
        <thead>
            <tr>
                <th>ID Pegawai</th>
                <th>Nama</th>
                <th>Divisi</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody>
        {% for row in pegawai %}
            <tr>
                <td>{{row.id}}</td>
                <td class="row-name">{{row.nama}}</td>
                <td>{{row.nama_divisi}}</td>
                <td>
                    <a href="{{ url_for('detail', id=row.id) }}" class="action-btn btn-detail">Detail 🔍</a>
                    <a href="#" class="action-btn btn-hapus" onclick="return confirm('Yakin ingin menghapus?')">Hapus 🗑️</a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
    <br><br>
    <div class="kembali-button">
        <a href="/pegawai/tambah-pegawai" class="tambah">Tambah Pegawai Baru</a>
        <a href="/" class="kembali">Kembali</a>
    </div>
    </section>
</body>
</html>
