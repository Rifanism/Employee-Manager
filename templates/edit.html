<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubah Data Karyawan</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            background-color: #f9f9f9; 
        }
        h1 { 
            color: #333; 
        }
        .form-container {
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
        }
        input[type="text"], 
        input[type="number"], 
        select { 
            width: calc(100% - 20px); 
            padding: 10px; 
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        /* Bedakan warna tombol Update */
        button { 
            padding: 10px 15px; 
            background-color: #28a745; /* Hijau */
            color: white; 
            border: none; 
            border-radius: 4px;
            cursor: pointer; 
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
        .link-kembali {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #007bff;
        }
        /* Tambahkan style untuk input yang 'readonly' */
        input[readonly] {
            background-color: #eee;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Ubah Data Karyawan</h1>
        
        <form action="#" method="POST" onsubmit="return false;">
            <div class="form-group">
                <label for="id_karyawan">ID Karyawan</label>
                <input type="text" id="id_karyawan" name="id_karyawan" value="K001" readonly>
            </div>
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" value="Budi Santoso" required>
            </div>
            <div class="form-group">
                <label for="posisi">Posisi</label>
                <select id="posisi" name="posisi">
                    <option value="Kasir" selected>Kasir</option>
                    <option value="Staf Gudang">Staf Gudang</option>
                    <option value="Pramuniaga">Pramuniaga</option>
                    <option value="Manajer">Manajer</option>
                </select>
            </div>
            <div class="form-group">
                <label for="gaji">Gaji</label>
                <input type="number" id="gaji" name="gaji" value="3500000" required>
            </div>
            <button type="submit">Update Data</button>
        </form>
        
        <a href="index.html" class="link-kembali">Kembali ke Daftar Karyawan</a>
    </div>

</body>
</html>
