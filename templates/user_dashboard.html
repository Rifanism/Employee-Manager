<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Minimarket - Presensi</title>

    <style>
        :root{
            --sidebar-mini:70px;
            --sidebar-full:230px;
            --sidebar-bg:tomato;
            --menu-hover: rgba(255,255,255,0.12);
        }

        *{box-sizing:border-box}
        body{
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
            background:#ffffff;
        }

        .sidebar{
            position:fixed;
            left:0; top:0;
            width:var(--sidebar-mini);
            height:100vh;
            background:var(--sidebar-bg);
            overflow:hidden;
            transition: width .28s ease;
            padding-top:18px;
        }
        .sidebar.active{ width:var(--sidebar-full); }

        .sidebar-header{
            display:flex;
            align-items:center;
            gap:10px;
            padding: 0 12px 12px 12px;
        }
        .toggle-btn{
            font-size:20px;
            background:none;
            border:none;
            color:#fff;
            cursor:pointer;
            padding:6px;
            line-height:1;
        }
        .sidebar-title{
            color:#fff;
            font-size:20px;
            font-weight:700;
            opacity:0;
            white-space:nowrap;
            transition: opacity .22s ease .05s;
        }
        .sidebar.active .sidebar-title{ opacity:1; }

        .menu-list{ margin:6px 0; padding:0; list-style:none; }

        .menu-item{
            display:flex;
            align-items:center;
            gap:12px;
            padding:10px 12px;
            color:#fff;
            text-decoration:none;
            font-size:16px;
            transition: background .18s ease;
            cursor:pointer;
            white-space:nowrap;
        }
        .menu-item:hover{ background: var(--menu-hover); }

        .menu-item .icon{
            flex:0 0 34px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
            line-height:1;
        }

        .menu-item .text{
            display:inline-block;
            overflow:hidden;
            max-width:0;
            opacity:0;
            transition: max-width .28s ease, opacity .18s ease .05s;
            vertical-align:middle;
        }

        .sidebar.active .menu-item .text{
            max-width:400px;
            opacity:1;
        }

        .menu-item.green{ background:transparent; }
        .menu-item.red{ background:transparent; }

        .content{
            margin-left: var(--sidebar-mini);
            padding:28px;
            transition: margin-left .28s ease;
        }
        .sidebar.active ~ .content{ margin-left: var(--sidebar-full); }

        .JUDUL{ text-align:center; color:#111; font-size:1.1rem; padding:10px 0; border-radius:100px; }
        
        .content-wrapper {
            width: max-content; 
            margin-left: auto;
            margin-right: auto;
            max-width: 95%; 
        }

        table{
            width:max-content;
            border-collapse:collapse;
            margin:20px auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            background:#fff;
            table-layout:auto;
            margin: 0;
        }
        th, td{
            border:1px solid #ddd;
            padding:12px 16px;
            text-align:center;
        }
        .row-name{ text-align:left; padding-left:18px; }
        th{ background:tomato; color:#fff; }
        tr:nth-child(even){ background:#f2f2f2; }

        @media (max-width:640px){
            .sidebar{ width:60px; }
            .sidebar.active{ width:200px; }
            .content{ padding:16px; }
            .menu-item{ padding:10px; font-size:15px; }
            .menu-item .icon{ flex-basis:30px; }
        }
        
        .table-container{
            max-height: 400px;
            overflow-y: auto;
            margin: 0;
            width: 100%;
            border: 1px solid #ddd;
            border-top: none;
        }

        .table-container thead th {
            position: sticky;
            top: 0;
            background-color: tomato;
            color: white;
            z-index: 2;
        }
        </style>
    </head>

    <body>

        <nav id="sidebar" class="sidebar" aria-label="Sidebar">
            <div class="sidebar-header">
                <button id="toggle-btn" class="toggle-btn" aria-expanded="false" aria-controls="menu-list">☰</button>
                <div class="sidebar-title">ToMart 🍅</div>
            </div>

            <ul id="menu-list" class="menu-list" role="menu">

                <li role="none">
                    <a role="menuitem" class="menu-item" href="/jadwal-kerja">
                        <span class="icon" aria-hidden="true">📅</span>
                        <span class="text">Jadwal Kerja</span>
                    </a>
                </li>

                <li role="none">
                    <a role="menuitem" class="menu-item green" href="/presensi-masuk">
                        <span class="icon" aria-hidden="true">➡️</span>
                        <span class="text">Presensi Masuk</span>
                    </a>
                </li>

                <li role="none">
                    <a role="menuitem" class="menu-item red" href="/presensi-pulang">
                        <span class="icon" aria-hidden="true">⬅️</span>
                        <span class="text">Presensi Pulang</span>
                    </a>
                </li>

                <li role="none">
                    <a role="menuitem" class="menu-item" href="/logout" title="Keluar">
                        <span class="icon" aria-hidden="true">📤</span>
                        <span class="text">Keluar</span>
                    </a>
                </li>
            </ul>
        </nav>

        <main class="content" id="content">
            <h1 class="JUDUL">Daftar Pegawai ToMart</h1>
            <div class="content-wrapper">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID Pegawai</th>
                                <th>Nama</th>
                                <th>Divisi</th>
                            </tr>
                        </thead>
                        <tbody>
                        {% for row in pegawai %}
                            <tr>
                                <td>{{row.id}}</td>
                                <td class="row-name">{{row.nama}}</td>
                                <td>{{row.nama_divisi}}</td>
                            </tr>
                        {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <script>
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('toggle-btn');

            toggleBtn.addEventListener('click', () => {
                const expanded = sidebar.classList.toggle('active');
                toggleBtn.setAttribute('aria-expanded', String(expanded));
            });
        </script>

    </body>
</html>
